# =====================================================================
# Docker Compose: повна інфраструктура застосунку
# Запуск:   docker compose up -d
# Логи:     docker compose logs -f app
# Зупинка:  docker compose down
# Очистка:  docker compose down -v   (видаляє дані БД)
# =====================================================================

services:

  # =================================================================
  # PostgreSQL — основна база даних
  # =================================================================
  db:
    image: postgres:16-alpine
    container_name: collab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_collab
      POSTGRES_USER: collab_user
      POSTGRES_PASSWORD: collab_secret
      LANG: uk_UA.utf8
    volumes:
      # Зберігаємо дані БД між перезапусками
      - postgres_data:/var/lib/postgresql/data
      # Скрипти ініціалізації виконуються при першому старті
      # (порядок за алфавітом)
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab_user -d student_collab"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - collab-network

# =====================================================================
# Volumes — постійне зберігання даних
# =====================================================================
volumes:
  postgres_data:
    name: collab_postgres_data
  pgadmin_data:
    name: collab_pgadmin_data

# =====================================================================
# Networks — ізольована мережа для контейнерів
# =====================================================================
networks:
  collab-network:
    name: collab-network
    driver: bridge
