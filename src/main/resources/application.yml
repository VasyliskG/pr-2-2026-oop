# =============================================================================
# Конфігурація застосунку: Student Collab Platform
# =============================================================================

spring:
  application:
    name: student-collab-platform
  config:
    import: optional:file:.env[.properties]


  # ---- Підключення до Supabase (PostgreSQL) ----
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    # ---- HikariCP Connection Pool ----
    hikari:
      pool-name: CollabHikariPool
      minimum-idle: 3
      maximum-pool-size: 15
      idle-timeout: 600000        # 10 хвилин
      max-lifetime: 1800000       # 30 хвилин
      connection-timeout: 30000   # 30 секунд
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1
      auto-commit: false
      data-source-properties:
        ssl: true
        sslmode: verify-ca
        sslrootcert: ${app.ssl.cert:${user.home}/.postgresql/root.crt}
        connectTimeout: 10
        socketTimeout: 30

  # ---- Ініціалізація схеми (для розробки) ----
  sql:
    init:
      mode: never                  # DDL і DML виконуються вручну

# =============================================================================
# Логування
# =============================================================================
logging:
  level:
    root: INFO
    ua.uzhnu.collab: DEBUG
    com.zaxxer.hikari: INFO
