name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build fat jar
        shell: bash
        run: mvn package -DskipTests -B

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir -p target/app-input
          cp target/student-collab-platform-*.jar target/app-input/

      - name: Create Windows installer
        shell: bash
        run: |
          JAR=$(ls target/app-input/*.jar | head -1 | xargs basename)
          jpackage \
            --input target/app-input \
            --main-jar "$JAR" \
            --name "StudentCollab" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --vendor "UZHNU" \
            --java-options "--add-opens javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens javafx.graphics/com.sun.glass.ui=ALL-UNNAMED" \
            --java-options "--add-exports javafx.graphics/com.sun.glass.ui=ALL-UNNAMED" \
            --java-options "-Dspring.datasource.url=${{ secrets.DB_URL }}" \
            --java-options "-Dspring.datasource.username=${{ secrets.DB_USER }}" \
            --java-options "-Dspring.datasource.password=${{ secrets.DB_PASSWORD }}" \
            --type exe \
            --dest target/dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: target/dist/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build fat jar
        shell: bash
        run: mvn package -DskipTests -B

      - name: Prepare jpackage input
        shell: bash
        run: |
          mkdir -p target/app-input
          cp target/student-collab-platform-*.jar target/app-input/

      - name: Create macOS installer
        shell: bash
        run: |
          JAR=$(ls target/app-input/*.jar | head -1 | xargs basename)
          jpackage \
            --input target/app-input \
            --main-jar "$JAR" \
            --name "StudentCollab" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --vendor "UZHNU" \
            --java-options "--add-opens javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens javafx.graphics/com.sun.glass.ui=ALL-UNNAMED" \
            --java-options "--add-exports javafx.graphics/com.sun.glass.ui=ALL-UNNAMED" \
            --java-options "-Dspring.datasource.url=${{ secrets.DB_URL }}" \
            --java-options "-Dspring.datasource.username=${{ secrets.DB_USER }}" \
            --java-options "-Dspring.datasource.password=${{ secrets.DB_PASSWORD }}" \
            --type dmg \
            --dest target/dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos
          path: target/dist/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build fat jar
        run: mvn package -DskipTests -B

      - name: Prepare jpackage input
        run: |
          mkdir -p target/app-input
          cp target/student-collab-platform-*.jar target/app-input/

      - name: Create Linux installer
        run: |
          JAR=$(ls target/app-input/*.jar | head -1 | xargs basename)
          jpackage \
            --input target/app-input \
            --main-jar "$JAR" \
            --name "StudentCollab" \
            --app-version "${{ steps.version.outputs.VERSION }}" \
            --vendor "UZHNU" \
            --java-options "--add-opens javafx.graphics/com.sun.javafx.application=ALL-UNNAMED" \
            --java-options "--add-opens javafx.graphics/com.sun.glass.ui=ALL-UNNAMED" \
            --java-options "--add-exports javafx.graphics/com.sun.glass.ui=ALL-UNNAMED" \
            --java-options "-Dspring.datasource.url=${{ secrets.DB_URL }}" \
            --java-options "-Dspring.datasource.username=${{ secrets.DB_USER }}" \
            --java-options "-Dspring.datasource.password=${{ secrets.DB_PASSWORD }}" \
            --type deb \
            --dest target/dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: target/dist/*.deb

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
        env:
          GH_TOKEN: ${{ github.token }}
